name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build and package
        run: ./scripts/build-app.sh

      - name: Verify application bundle
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint CursorQuota/Info.plist
          lipo CursorQuota.app/Contents/MacOS/CursorQuota -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 CursorQuota.app

      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(plutil -extract CFBundleShortVersionString raw CursorQuota/Info.plist)"
          ditto -c -k --sequesterRsrc --keepParent CursorQuota.app "CursorQuota-${version}.zip"
          unzip -t "CursorQuota-${version}.zip"
