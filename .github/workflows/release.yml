name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag and bundle version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          short_version="$(plutil -extract CFBundleShortVersionString raw CursorQuota/Info.plist)"
          build_version="$(plutil -extract CFBundleVersion raw CursorQuota/Info.plist)"
          [[ "${version}" == "${short_version}" ]]
          [[ "${version}" == "${build_version}" ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          conclusion="$(
            gh run list \
              --workflow CI \
              --commit "${GITHUB_SHA}" \
              --status completed \
              --json conclusion \
              --jq 'map(select(.conclusion == "success"))[0].conclusion // ""'
          )"
          [[ "${conclusion}" == "success" ]] || {
            echo "The tagged commit does not have a successful completed CI run." >&2
            exit 1
          }

      - name: Configure Developer ID signing
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVELOPER_ID_APPLICATION_P12:-}" ]]; then
            echo "No Developer ID certificate configured; using ad-hoc signing."
            exit 0
          fi
          for required in \
            DEVELOPER_ID_APPLICATION_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID; do
            [[ -n "${!required:-}" ]] || {
              echo "${required} is required alongside the Developer ID certificate." >&2
              exit 1
            }
          done

          keychain="${RUNNER_TEMP}/cursor-quota.keychain-db"
          certificate="${RUNNER_TEMP}/developer-id.p12"
          password="$(openssl rand -hex 24)"

          printf '%s' "${DEVELOPER_ID_APPLICATION_P12}" | base64 --decode > "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" \
            -k "${keychain}" \
            -P "${DEVELOPER_ID_APPLICATION_PASSWORD}" \
            -T /usr/bin/codesign
          rm -f "${certificate}"
          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          # Keep login/System trust roots searchable alongside the temporary keychain.
          security list-keychains -d user -s "${keychain}" ${existing_keychains}
          security default-keychain -d user -s "${keychain}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${password}" \
            "${keychain}"

          identity="$(
            security find-identity -v -p codesigning "${keychain}" |
              awk '/Developer ID Application/ {print $2; exit}'
          )"
          [[ -n "${identity}" ]]
          echo "CODE_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"

      - name: Build universal application
        run: ./scripts/build-app.sh

      - name: Package application archive
        shell: bash
        run: |
          set -euo pipefail
          archive="CursorQuota-${GITHUB_REF_NAME#v}.zip"
          ditto -c -k --sequesterRsrc --keepParent CursorQuota.app "${archive}"
          echo "RELEASE_ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Notarize Developer ID build
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "${CODE_SIGN_IDENTITY:--}" == "-" ]]; then
            echo "Ad-hoc build; skipping notarization."
            exit 0
          fi
          xcrun notarytool submit "${RELEASE_ARCHIVE}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          # Staple so the download opens without a network round trip.
          xcrun stapler staple CursorQuota.app
          rm "${RELEASE_ARCHIVE}"
          ditto -c -k --sequesterRsrc --keepParent CursorQuota.app "${RELEASE_ARCHIVE}"

      - name: Package debug symbols
        shell: bash
        run: |
          set -euo pipefail
          symbols="${RUNNER_TEMP}/CursorQuota-${GITHUB_REF_NAME#v}-dSYMs"
          mkdir -p "${symbols}"
          for dsym in .build/apple/Products/Release/*.dSYM; do
            ditto "${dsym}" "${symbols}/$(basename "${dsym}")"
          done
          ditto -c -k --keepParent \
            "${symbols}" \
            "CursorQuota-${GITHUB_REF_NAME#v}.dSYM.zip"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          symbols="CursorQuota-${tag#v}.dSYM.zip"

          # Create as a draft so a partial upload is never downloadable. A rerun
          # against an already-published release replaces assets in place rather
          # than unpublishing it, which would 404 the existing download URLs.
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "CursorQuota ${tag#v}"
          fi

          gh release upload "${tag}" "${RELEASE_ARCHIVE}" "${symbols}" --clobber
          gh release edit "${tag}" --draft=false --latest

          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          curl -fsIL --retry 8 --retry-delay 5 "${base}/${RELEASE_ARCHIVE}" >/dev/null
