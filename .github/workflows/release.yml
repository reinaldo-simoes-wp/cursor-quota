name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and bundle version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          short_version="$(plutil -extract CFBundleShortVersionString raw CursorQuota/Info.plist)"
          build_version="$(plutil -extract CFBundleVersion raw CursorQuota/Info.plist)"
          [[ "${version}" == "${short_version}" ]]
          [[ "${version}" == "${build_version}" ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          conclusion="$(
            gh run list \
              --workflow CI \
              --commit "${GITHUB_SHA}" \
              --status completed \
              --json conclusion \
              --jq 'map(select(.conclusion == "success"))[0].conclusion // ""'
          )"
          [[ "${conclusion}" == "success" ]] || {
            echo "The tagged commit does not have a successful completed CI run." >&2
            exit 1
          }

      - name: Configure Developer ID signing
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVELOPER_ID_APPLICATION_P12:-}" ]]; then
            echo "No Developer ID certificate configured; using ad-hoc signing."
            exit 0
          fi
          [[ -n "${DEVELOPER_ID_APPLICATION_PASSWORD:-}" ]] || {
            echo "DEVELOPER_ID_APPLICATION_PASSWORD is required with the certificate." >&2
            exit 1
          }
          [[ -n "${APPLE_ID:-}" ]] || {
            echo "APPLE_ID is required for notarization." >&2
            exit 1
          }
          [[ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]] || {
            echo "APPLE_APP_SPECIFIC_PASSWORD is required for notarization." >&2
            exit 1
          }
          [[ -n "${APPLE_TEAM_ID:-}" ]] || {
            echo "APPLE_TEAM_ID is required for notarization." >&2
            exit 1
          }

          keychain="${RUNNER_TEMP}/cursor-quota.keychain-db"
          certificate="${RUNNER_TEMP}/developer-id.p12"
          password="$(openssl rand -hex 24)"

          printf '%s' "${DEVELOPER_ID_APPLICATION_P12}" | base64 --decode > "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" \
            -k "${keychain}" \
            -P "${DEVELOPER_ID_APPLICATION_PASSWORD}" \
            -T /usr/bin/codesign
          rm -f "${certificate}"
          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          # Keep login/System trust roots searchable alongside the temporary keychain.
          security list-keychains -d user -s "${keychain}" ${existing_keychains}
          security default-keychain -d user -s "${keychain}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${password}" \
            "${keychain}"

          identity="$(
            security find-identity -v -p codesigning "${keychain}" |
              awk '/Developer ID Application/ {print $2; exit}'
          )"
          [[ -n "${identity}" ]]
          echo "CODE_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"

      - name: Build universal application
        run: ./scripts/build-app.sh

      - name: Validate Sparkle signing key
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${SPARKLE_PRIVATE_KEY:-}" ]] || {
            echo "SPARKLE_PRIVATE_KEY is required." >&2
            exit 1
          }

          private_key="${RUNNER_TEMP}/sparkle-private-key"
          trap 'rm -f "${private_key}"' EXIT
          printf '%s' "${SPARKLE_PRIVATE_KEY}" > "${private_key}"
          decoded_bytes="$(base64 --decode < "${private_key}" | wc -c | tr -d ' ')"
          [[ "${decoded_bytes}" == "32" ]] || {
            echo "SPARKLE_PRIVATE_KEY is not a valid 32-byte Sparkle seed." >&2
            exit 1
          }

          tools=".build/artifacts/sparkle/Sparkle/bin"
          "${tools}/generate_keys" \
            --account cursor-quota-release \
            -f "${private_key}" >/dev/null
          derived_public_key="$(
            "${tools}/generate_keys" --account cursor-quota-release -p
          )"
          embedded_public_key="$(
            plutil -extract SUPublicEDKey raw CursorQuota/Info.plist
          )"
          [[ "${derived_public_key}" == "${embedded_public_key}" ]] || {
            echo "SPARKLE_PRIVATE_KEY does not match Info.plist SUPublicEDKey." >&2
            exit 1
          }

      - name: Package update archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="CursorQuota-${version}.zip"
          ditto -c -k --sequesterRsrc --keepParent CursorQuota.app "${archive}"
          echo "UPDATE_ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Notarize Developer ID build
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "${CODE_SIGN_IDENTITY:--}" == "-" ]]; then
            echo "Ad-hoc build; skipping notarization."
            exit 0
          fi
          [[ -n "${APPLE_ID:-}" ]]
          [[ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]
          [[ -n "${APPLE_TEAM_ID:-}" ]]

          xcrun notarytool submit "${UPDATE_ARCHIVE}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple CursorQuota.app
          rm "${UPDATE_ARCHIVE}"
          ditto -c -k --sequesterRsrc --keepParent CursorQuota.app "${UPDATE_ARCHIVE}"

      - name: Package debug symbols
        shell: bash
        run: |
          set -euo pipefail
          symbols="${RUNNER_TEMP}/CursorQuota-${GITHUB_REF_NAME#v}-dSYMs"
          mkdir -p "${symbols}"
          for dsym in .build/apple/Products/Release/*.dSYM; do
            ditto "${dsym}" "${symbols}/$(basename "${dsym}")"
          done
          ditto -c -k --keepParent \
            "${symbols}" \
            "CursorQuota-${GITHUB_REF_NAME#v}.dSYM.zip"

      - name: Generate signed Sparkle appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "${SPARKLE_PRIVATE_KEY}" ]]
          mkdir update-feed
          mv "${UPDATE_ARCHIVE}" update-feed/
          version="${GITHUB_REF_NAME#v}"
          notes="CursorQuota-${version}.md"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body > "update-feed/${notes}"
          tools=".build/artifacts/sparkle/Sparkle/bin"
          printf '%s' "${SPARKLE_PRIVATE_KEY}" |
            "${tools}/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --full-release-notes-url \
                "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
              --embed-release-notes \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              update-feed
          mv "update-feed/${UPDATE_ARCHIVE}" .
          mv update-feed/appcast.xml .
          mv "update-feed/${notes}" release-notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          symbols="CursorQuota-${tag#v}.dSYM.zip"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --draft \
              --verify-tag \
              --notes-file release-notes.md \
              --title "CursorQuota ${tag#v}"
          else
            gh release edit "${tag}" \
              --draft \
              --notes-file release-notes.md \
              --title "CursorQuota ${tag#v}"
          fi

          # Upload the feed last so it never points at an absent archive.
          gh release upload "${tag}" "${UPDATE_ARCHIVE}" "${symbols}" --clobber
          gh release upload "${tag}" appcast.xml --clobber

          assets="$(
            gh release view "${tag}" \
              --json assets \
              --jq '[.assets[].name] | sort | join(\"\\n\")'
          )"
          for required in "${UPDATE_ARCHIVE}" "${symbols}" appcast.xml; do
            printf '%s\n' "${assets}" | awk -v expected="${required}" '
              $0 == expected { found = 1 }
              END { exit !found }
            '
          done

          gh release edit "${tag}" --draft=false --latest

          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          curl -fsIL --retry 8 --retry-delay 5 "${base}/appcast.xml"
          curl -fsIL --retry 8 --retry-delay 5 "${base}/${UPDATE_ARCHIVE}"
